# Wait for the host CPU temperature object before building the static fan
# policy, as Nuvoton's EVB unit does for its temperature sensor. Without this,
# swampd can build a permanently failed CPU sensor if CPU_1 appears after
# startup, leaving the zone in 100% failsafe.
[Unit]
After=xyz.openbmc_project.hwmontempsensor.service

[Service]
# CPU_1 can be absent while the host is off; do not time the wait out.
TimeoutStartSec=infinity
ExecStartPre=/usr/bin/env mapper wait /xyz/openbmc_project/sensors/temperature/CPU_1
