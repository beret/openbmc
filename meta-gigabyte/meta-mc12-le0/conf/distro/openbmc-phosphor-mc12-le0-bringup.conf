# MC12-LE0 bring-up/test distro profile.
#
# This is not a production distro. Select it explicitly from local.conf:
#   DISTRO = "openbmc-phosphor-mc12-le0-bringup"
#
# It enables the board-scoped mc12-le0-bringup feature. That feature currently
# defines only DISTRO_FEATURES / df-mc12-le0-bringup; it does not enable root
# login or install probe packages. Do not ship a bring-up image.

require conf/distro/openbmc-phosphor.conf
require conf/distro/include/mc12-le0-bringup.inc

DISTRO_NAME = "Phosphor OpenBMC MC12-LE0 bring-up"
IMAGE_NAME:append = "-bringup"
