# MC12-LE0 in the Fractal Design Node 804 chassis.
#
# Board support is inherited unchanged from meta-mc12-le0. Only the fan/thermal
# policy in this layer is Node 804-specific:
#   zone 1: CPU_FAN
#   zone 2: SYS_FAN3 (spare), SYS_FAN5 (CPU-chamber intake); includes
#           host-fed HBA_Temp in the motherboard passive group
#   zone 3: SYS_FAN1 (NVMe blower), driven by host-fed NVMe_Temp
#   zone 4: SYS_FAN2 (drive exhaust) + SYS_FAN4 (drive intake), driven by
#           host-fed HDD_Temp
#
# Other MC12-LE0 builds continue to use MACHINE = "mc12-le0" and the generic
# two-zone policy from the board layer.

require conf/machine/mc12-le0.conf

# Keep board-level :mc12-le0 overrides active in addition to the new machine.
MACHINEOVERRIDES =. "mc12-le0:"
