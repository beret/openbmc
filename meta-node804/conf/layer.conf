# Node 804 chassis policy for the Gigabyte MC12-LE0.
#
# This layer is deliberately separate from meta-gigabyte/meta-mc12-le0: the
# board layer owns the generic two-zone fan policy, while this layer owns the
# Node 804 host-sensor bridge, fan limits, NVMe blower zone and HDD zone.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "node804"
BBFILE_PATTERN_node804 = "^${LAYERDIR}/"
LAYERVERSION_node804 = "1"
LAYERSERIES_COMPAT_node804 = "wrynose"
