# The static PID policy binds sensors at startup. Wait for all host-fed
# ExternalSensor objects before building the four-zone policy; otherwise the
# drive zones and the HBA input would be permanently failed until a controller
# restart.
#
# The objects exist even when the host is off (Value is NaN), because
# Entity Manager creates the ExternalSensor service at BMC boot. The board's
# 10-wait-cpu-sensor.conf already sets TimeoutStartSec=infinity.
[Unit]
After=xyz.openbmc_project.externalsensor.service

[Service]
ExecStartPre=/usr/bin/env mapper wait /xyz/openbmc_project/sensors/temperature/NVMe_Temp
ExecStartPre=/usr/bin/env mapper wait /xyz/openbmc_project/sensors/temperature/HDD_Temp
ExecStartPre=/usr/bin/env mapper wait /xyz/openbmc_project/sensors/temperature/HBA_Temp
